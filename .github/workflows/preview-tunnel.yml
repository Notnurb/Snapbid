name: Preview tunnel

# Runs the app on a GitHub runner and exposes it through a Cloudflare quick
# tunnel. Trigger manually; the URL is published to the tunnel-info branch.
# The tunnel stays up ~5 hours or until the run is canceled.
#
# Auth: runs `next dev` so Clerk keyless mode provisions a temporary dev
# instance automatically — sign-in works with zero configured keys. Add real
# keys as repo secrets (CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,
# GROQ_API_KEY, ...) to use your own instance and enable AI/payments/email.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snapbid
          POSTGRES_PASSWORD: snapbid
          POSTGRES_DB: snapbid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapbid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Open Cloudflare tunnel
        id: tunnel
        run: |
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat tunnel.log; exit 1; fi
          echo "TUNNEL_URL: $URL"
          echo "::notice title=SnapBid preview tunnel::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write env
        env:
          CLERK_SK: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          cat > .env <<EOF
          DATABASE_URL="postgresql://snapbid:snapbid@localhost:5432/snapbid"
          DIRECT_URL="postgresql://snapbid:snapbid@localhost:5432/snapbid"
          NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}"
          SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}"
          GROQ_API_KEY="${{ secrets.GROQ_API_KEY || 'placeholder' }}"
          STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}"
          STRIPE_WEBHOOK_SECRET="whsec_placeholder"
          RESEND_API_KEY="${{ secrets.RESEND_API_KEY || 're_placeholder' }}"
          NEXT_PUBLIC_APP_URL="${{ steps.tunnel.outputs.url }}"
          EOF
          # Clerk keys are written only when real ones exist as secrets;
          # otherwise they're omitted entirely so keyless mode activates.
          if [ -n "$CLERK_SK" ] && [ -n "$CLERK_PK" ]; then
            echo "CLERK_SECRET_KEY=$CLERK_SK" >> .env
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PK" >> .env
          fi

      - name: Create tables
        run: npx prisma db push --skip-generate

      - name: Start app (dev mode for Clerk keyless)
        run: |
          nohup npm run dev > server.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/ || { cat server.log; exit 1; }

      # Job logs aren't readable until the job ends, so publish the URL to a
      # branch that can be fetched while the tunnel is still up.
      - name: Publish tunnel URL to tunnel-info branch
        run: |
          CLAIM_URL=$(grep -oE 'https://[^ ]*clerk[^ ]*keyless[^ ]*' server.log | head -1 || true)
          if [ -z "$CLAIM_URL" ] && [ -f .clerk/.tmp/keyless.json ]; then
            CLAIM_URL=$(grep -oE '"claimUrl":"[^"]+"' .clerk/.tmp/keyless.json | cut -d'"' -f4 || true)
          fi
          DIR=$(mktemp -d)
          SRC=$(pwd)
          cd "$DIR"
          git init -q -b tunnel-info
          git config user.name "snapbid-tunnel"
          git config user.email "actions@github.com"
          {
            echo "${{ steps.tunnel.outputs.url }}"
            echo "run: ${{ github.run_id }}"
            date -u +"started: %Y-%m-%dT%H:%M:%SZ"
            [ -n "$CLAIM_URL" ] && echo "clerk_claim: $CLAIM_URL"
          } > TUNNEL_URL.txt
          git add TUNNEL_URL.txt
          git commit -q -m "tunnel url for run ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tunnel-info
          cd "$SRC"

      - name: Keep tunnel alive (~5h)
        run: sleep 18000
